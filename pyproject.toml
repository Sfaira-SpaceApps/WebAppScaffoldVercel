[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vercel-fastapi-scaffold"
version = "0.1.0"
description = "Minimal FastAPI + PostgreSQL scaffold for Vercel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=7,<8",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pyvo>=1.6,<2",
    "requests>=2.32,<3",
    "alembic>=1.14,<2",
    "fastapi>=0.129,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
